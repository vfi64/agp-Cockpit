# managed template — source of truth: .agentic/ci/agentic-gate.yaml
name: Agentic Gate
"on":
  pull_request:
  # AGP_CI_GATE_V2: push runs only on main; a PR commit used to run twice
  # (push + pull_request, e.g. #501/#502).
  push:
    branches: [main]

# A newer commit on the same PR cancels the older PR run; main runs are never
# cancelled (one group per commit), the Cockpit verifies main CI after merges.
concurrency:
  group: agentic-gate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# AGP_CI_RUNNER_PINNED_V1 (2026-10-07): the image is pinned (ubuntu-latest moves to Ubuntu 26 on
# 2026-10-19) and the actions run on Node 24 (Node 20 is deprecated on GitHub's runners).
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # AGP_CI_LIGHT_REFRESH_V1 (Kit 1.0.25, KIT-GF-063): the Kit classifies the pull request. A refresh
    # pull request whose diff stays inside the Kit's own administrative paths runs light: Kit check and
    # doctor only, no pytest, and the browser job is skipped (AGP_CI_LIGHT_SKIP_DECLARED_V1). Any other
    # branch, path, event or a failed classification runs full. The classifier stays in this job; since
    # Kit 1.1.2 (KIT-GF-071) kit update could also keep a second pin in a separate classify job.
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      # Pinned: CI checks with the same Kit version as the developer machine (KIT-GF-042: no ci-update here).
      - run: python -m pip install "agentic-project-kit==1.1.4"
      - id: plan
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          BRANCH: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          agentic-kit ci runtime-plan --base "$BASE" --head "$HEAD" --branch "$BRANCH" --event-name "$EVENT" --json > "$RUNNER_TEMP/runtime-plan.json" || true
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/runtime-plan.json")); print("mode="+("light" if p.get("mode")=="light" else "full"),file=open(os.environ["GITHUB_OUTPUT"],"a")); print("runtime plan:",p.get("mode"),p.get("reason"))' || echo "mode=full" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.mode != 'light'
        run: |
          python -m pip install -e . pytest
          python -m pytest -q
      - run: |
          agentic-kit check --root .
          agentic-kit doctor --root .

  browser:
    needs: python
    # AGP_CI_LIGHT_SKIP_DECLARED_V1 (Kit 1.1.2, KIT-GF-073, replaces AGP_CI_LIGHT_NO_SKIP_V1): skipped on
    # the light path. `.agentic/config.yaml` declares `gates.light_path_skipped_checks: [browser]`; the
    # Kit's pr wait-ci, PR status and post-merge settlement accept the SKIPPED check only when they
    # re-derive the pull request as light. always() keeps it running when the classifier failed (full).
    if: always() && needs.python.outputs.mode != 'light'
    runs-on: ubuntu-24.04
    # AGP_CI_TIMEOUTS_V1 (live 2026-10-07, main run of #299): apt hung 23 min on the
    # azure.archive.ubuntu.com mirror inside "playwright install-deps" (GitHub's default job
    # timeout is 6 h). apt now gives up per request and retries; each install step and the job
    # have a hard limit, so a hanging mirror ends red within minutes instead of blocking main.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/99agp-timeouts
      - if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - run: npx playwright test
        timeout-minutes: 15

  # Stable required check: the name stays "agentic-gate"; it is green only if the python job is green and
  # the browser job is green, or skipped on the light path.
  agentic-gate:
    needs: [python, browser]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # The browser job may only be skipped on the light path; a skip on a full run fails the gate.
      - run: |
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.browser.result }}" = "success" || { test "${{ needs.browser.result }}" = "skipped" && test "${{ needs.python.outputs.mode }}" = "light"; }
