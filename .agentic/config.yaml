kit_schema_version: 2
project:
  name: agp-Cockpit
  type: generic
profile: generic
modules:
  doc_registry: true
  release_governance: true
  rule_registry: true
  transfer: true
transfer:
  visibility: repo
hygiene:
  doc_lifecycle: warn
  review_budgets:
    governance: 180
    reference: 365
    workflow: 270
paths:
  docs_root: docs
gates:
  extra: []
  skip: []
# P11c (owner 2026-10-05, AGP_KIT_GITHUB_RELEASE_V1): the Kit's signed release run creates the
# annotated tag and the GitHub Release entry of the repository (publication: github); switched on
# 2026-10-08 with Kit 1.0.20. Since Kit 1.0.21 (KIT-GF-049) the Kit-repository checks skip
# themselves in an external workspace, so the former `publish_checks: none` override is gone.
# (A broken comment line had left a duplicate key „publication: github);“ here; YAML kept the last.)
publication: github
release:
  github_release_title_template: "AGP Cockpit {version}"
  # AGP_RELEASE_RUN_AUTONOMY_V1 (owner 2026-10-08 „vollautonom“, 2026-10-13 „1b“): the Release task
  # runs `agentic-kit release run`; the start click is the consent the Kit records once at gate B4
  # (KIT-GF-061), later gates pass only while version, tag and target commit match. Release branches
  # keep the Cockpit's name release/<version> (KIT-GF-065, Kit 1.0.22).
  approval: upfront
  branch_prefix: release/
  # AGP_VERSION_MAP_V2 (owner 2026-10-04, KIT-GF-037 fixed in Kit 1.0.16):
  # `release prepare --write` updates these anchors; release-check and the
  # release commit integrity check verify them.
  version_anchors:
    - kind: source_constant
      path: src/agp_cockpit/version.py
      name: APP_VERSION
      label: APP_VERSION
    # AGP_BUILD_ID_DERIVED_V1 (owner 2026-10-09): the extension's build id follows this version.
    - kind: source_constant
      path: chrome_extension/build_identity.js
      name: AGP_APP_VERSION
      label: AGP_APP_VERSION (extension build id)
    - kind: json_table
      path: docs/releases/versions.json
      label: AGP_VERSION_MAP_V1 app version
      list: releases
      version_field: app
      position: append
      row:
        app: '{version}'
        build_id: 'release-{version}'
        kit: '{kit_version}'
        date: '{date}'
        tag: '{tag}'
        published: false
# AGP_NS_LEGACY_EVIDENCE_V1 (Kit 1.0.25, KIT-GF-068): the findings ledger records Kit defects and quotes
# legacy command references as evidence, and so do the committed retest evidence files; the Kit's
# legacy-reference audit treats exactly these files as declared evidence. Scripts and docs that instruct stay outside the declaration.
audit:
  ns_legacy:
    evidence_paths:
      - docs/validation/AGENTIC_KIT_GREENFIELD_FINDINGS.json
      - docs/validation/AGENTIC_KIT_GREENFIELD_FINDINGS.md
      - docs/validation/evidence/*.json
