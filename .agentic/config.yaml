kit_schema_version: 2
project:
  name: agp-Cockpit
  type: generic
profile: generic
modules:
  doc_registry: true
  release_governance: true
  rule_registry: true
  transfer: true
transfer:
  visibility: repo
hygiene:
  doc_lifecycle: warn
  review_budgets:
    governance: 180
    reference: 365
    workflow: 270
paths:
  docs_root: docs
gates:
  extra: []
  skip: []
# P11c (owner 2026-10-05, AGP_KIT_GITHUB_RELEASE_V1): the Kit's signed release run creates the
# annotated tag and the GitHub Release entry of the private repository (publication: github);
# switched on 2026-10-08 with Kit 1.0.20 (KIT-GF-049). `publish_checks: none` is the Kit's own
# setting for external workspaces: the auto-detection still runs `transfer command-reference-check`
# here because this workspace carries the Kit command reference, and that check runs a test file of
# the Kit repository (KIT-GF-049 reproduced in 1.0.20). Reference drift is caught by
# `commands sync-entrypoints` and `agentic-kit check` instead.
publication: github
release:
  github_release_title_template: "AGP Cockpit {version}"
  publish_checks: none
  # AGP_VERSION_MAP_V2 (owner 2026-10-04, KIT-GF-037 fixed in Kit 1.0.16):
  # `release prepare --write` updates these anchors; release-check and the
  # release commit integrity check verify them.
  version_anchors:
    - kind: source_constant
      path: src/agp_cockpit/version.py
      name: APP_VERSION
      label: APP_VERSION
    - kind: json_table
      path: docs/releases/versions.json
      label: AGP_VERSION_MAP_V1 app version
      list: releases
      version_field: app
      position: append
      row:
        app: '{version}'
        build_id: 'release-{version}'
        kit: '{kit_version}'
        date: '{date}'
        tag: '{tag}'
        published: false
