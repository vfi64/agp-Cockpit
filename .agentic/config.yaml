kit_schema_version: 2
project:
  name: agp-Cockpit
  type: generic
profile: generic
modules:
  doc_registry: true
  release_governance: true
  rule_registry: true
  transfer: true
transfer:
  visibility: repo
hygiene:
  doc_lifecycle: warn
  review_budgets:
    governance: 180
    reference: 365
    workflow: 270
paths:
  docs_root: docs
gates:
  extra: []
  skip: []
# P11c (owner 2026-10-05, AGP_KIT_GITHUB_RELEASE_V1): the Kit's signed release run shall create
# the GitHub Release entry (publication: github). Kit 1.0.18 still runs Kit-repository checks
# for it (docs-audit, command-reference-check; KIT-GF-049), so this stays `none` until that fix
# is released and retested; the title template below is already used then.
publication: none
release:
  github_release_title_template: "AGP Cockpit {version} (privat)"
  # AGP_VERSION_MAP_V2 (owner 2026-10-04, KIT-GF-037 fixed in Kit 1.0.16):
  # `release prepare --write` updates these anchors; release-check and the
  # release commit integrity check verify them.
  version_anchors:
    - kind: source_constant
      path: src/agp_cockpit/version.py
      name: APP_VERSION
      label: APP_VERSION
    - kind: json_table
      path: docs/releases/versions.json
      label: AGP_VERSION_MAP_V1 app version
      list: releases
      version_field: app
      position: append
      row:
        app: '{version}'
        build_id: 'release-{version}'
        kit: '{kit_version}'
        date: '{date}'
        tag: '{tag}'
        published: false
